<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inner Map</title>
<script>
  // The share link (my-inner-map.com/app): an iPhone or iPad goes to the App
  // Store, an Android phone to Google Play. Anything else stays on this page
  // and sees both.
  (function () {
    var APPLE = "https://apps.apple.com/app/id6766533934";
    var GOOGLE = "https://play.google.com/store/apps/details?id=com.srulischor.innermap";
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var android = /Android/i.test(ua);
    if (ios) window.location.replace(APPLE);
    else if (android) window.location.replace(GOOGLE);
  })();
</script>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 64px 24px 96px;
    line-height: 1.6;
    color: #1a1a1a;
    background: #ffffff;
    font-size: 17px;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 2em; line-height: 1.3; color: #111111; margin: 0 0 1em; }
  ul { list-style: none; padding: 0; margin: 0; }
  a {
    display: block;
    font-size: 1.1em;
    color: #1a5490;
    text-decoration: none;
    padding: 18px 20px;
    margin: 12px 0;
    border: 1px solid #d8d8d8;
    border-radius: 8px;
  }
</style>
</head>
<body>
<h1>Inner Map</h1>
<ul>
  <li><a href="https://apps.apple.com/app/id6766533934">App Store</a></li>
  <li><a href="https://play.google.com/store/apps/details?id=com.srulischor.innermap">Google Play</a></li>
</ul>
</body>
</html>
